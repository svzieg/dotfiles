# ============================================================================
# TMUX CONFIG — Catppuccino Mocha Style + Project Multiplexer
# ============================================================================

# --- Catppuccino Mocha Colors ( Gruvbox Dark variant for tmux ) ---
# Based on Catppuccino Mocha palette
set -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Color palette
set -g @color-bg "#1e1e2e"       # Base (Catppuccino Mocha base)
set -g @color-fg "#cdd6f4"       # Text (Catppuccino Mocha text)
set -g @color-accent "#f5c2e7"   # Rosewater equivalent
set -g @color-mauve "#cba6f7"    # Mauve (accent)
set -g @color-teal "#94e2d5"     # Teal (info)
set -g @color-peach "#fab387"    # Peach (warning)
set -g @color-red "#f38ba8"      # Red (error)
set -g @color-green "#a6e3a1"    # Green (success)
set -g @color-muted "#6c7086"    # Muted/secondary text
set -g @color-border "#313244"   # Border/background dark

# Status bar
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=#{@color-bg},fg=#{@color-fg}"
set -g status-left "#[fg=#{@color-mauve},bold]#{session_name}#[fg=#{@color-fg}] │ " 
set -g status-right "#[fg=#{@color-accent}]%H:%M:%S #[fg=#{@color-teal}]%d-%b-%y " 
set -g status-left-length 50
set -g status-right-length 80

# Window status
set -g window-status-format "#[fg=#{@color-muted}] #I: #W "
set -g window-status-current-format "#[fg=#{@color-mauve},bold] #I: #W "
set -g window-status-separator "  "

# Pane border styling
run-shell 'tmux set -g pane-border-style "fg=$(tmux show -gv @color-border)"'
run-shell 'tmux set -g pane-active-border-style "fg=$(tmux show -gv @color-mauve)"'
set -g pane-border-format "#{?pane_active,#[fg=#{@color-mauve}],#[fg=#{@color-muted}]}#{pane_title}"

# Message styling
run-shell 'tmux set -g message-style "bg=$(tmux show -gv @color-border),fg=$(tmux show -gv @color-fg)"'
run-shell 'tmux set -g message-command-style "bg=$(tmux show -gv @color-border),fg=$(tmux show -gv @color-fg)"'

# Mode (copy/vi) styling
run-shell 'tmux set -g mode-style "bg=$(tmux show -gv @color-border),fg=$(tmux show -gv @color-mauve)"'

# Clock
run-shell 'tmux set -g clock-mode-colour "$(tmux show -gv @color-mauve)"'
set -g clock-mode-style 24

# --- Mouse Mode ---
set -g mouse on

# --- TPM (Tmux Plugin Manager) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist sessions
set -g @plugin 'tmux-plugins/tmux-continuum'     # Auto-save sessions

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

# Resurrect settings
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# --- Key Bindings ---
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes (same directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Better copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane synchronization
bind s setw synchronize-panes

# --- Window/Pane Indexing ---
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# --- Activity Monitoring ---
setw -g monitor-activity on
set -g visual-activity off

# --- Escape Time (for vim) ---
set -sg escape-time 0

# --- History Limit ---
set -g history-limit 50000

# --- Focus Events ---
set -g focus-events on

# --- OSC52 Clipboard Passthrough ---
# Allows tmux to forward OSC52 sequences for clipboard over SSH
set -s set-clipboard on


set -g extended-keys on
set -g extended-keys-format csi-u

# --- Initialize TPM (keep this at the very end) ---
run '~/.tmux/plugins/tpm/tpm'
